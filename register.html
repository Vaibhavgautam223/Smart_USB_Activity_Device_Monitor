{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}
<div class="login">
  <div class="panel">
    <h2 class="mb-1">Create your account</h2>
    <p class="text-secondary mb-4">Sign up to monitor and control USB devices</p>
    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{csrf_token}}">
      <label>Username</label>
      <input class="form-control mb-3" name="username" value="{{username}}" minlength="3" maxlength="50"
             pattern="[A-Za-z0-9_.\-]{3,50}" required autofocus>
      <label>Password</label>
      <input class="form-control mb-3" type="password" name="password" minlength="8" required
             autocomplete="new-password">
      <label>Confirm password</label>
      <input class="form-control mb-4" type="password" name="confirm" minlength="8" required
             autocomplete="new-password">
      <button class="btn btn-primary w-100">Create account</button>
    </form>
    <div class="text-center mt-3">
      <small class="text-secondary">Already have an account?
        <a href="{{url_for('login')}}">Sign in</a>
      </small>
    </div>
  </div>
</div>
{% endblock %}
